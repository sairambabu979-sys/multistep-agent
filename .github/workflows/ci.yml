name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types (mypy --strict)
        run: uv run mypy

      - name: Architecture contracts
        run: uv run lint-imports

      - name: State machine static analysis
        run: uv run msa fsm check

      - name: Tests (unit, property, model-based, exhaustive model check, contracts)
        run: uv run pytest --cov --cov-report=term-missing

      - name: Core coverage gate (95% branch)
        run: uv run coverage report --include='src/msa/core/*' --fail-under=95
