name: live run

# The agents on a real task with the real model, nothing scripted, on the inventory fixture
# (tests/fixtures/repos/inventory), with every stage real. It spends, so it is manual only,
# and the budget is a hard cap.
#
# Tasks (.github/live-run/):
# - restock: the definition-of-done task of tests/integration/test_demo.py.
# - round-trip: from_csv(to_csv(store)) must hold the same items for any store. The
#   fixture's to_csv does not quote, so a SKU holding a comma breaks it today. A change that
#   ignores that leaves something real for the Reviewer to find.
# - restock-atomic: restock, plus the rule that a bad delivery note changes nothing. With
#   seeded, the planted non-atomic receive() breaks a rule the task states, so whatever real
#   role catches it (the Tester's tests or the Reviewer) caught a planted defect.
# - restock-scale: restock-atomic, plus the rule that receive never scans or sorts the whole
#   store for a line. Seeded, the planted receive breaks only that rule, which no timing on
#   a small store shows. In live-8 the real Tester's tests caught it anyway.
# - thread-safe: make Store safe to share between threads, with a consistent items() snapshot.
#   Races are what tests rarely catch and reviews often do: an unlocked read, a snapshot
#   taken outside the lock, a lock held too widely.
#
# Agent commands and the integration suite run without network, and must: the run's
# settings say isolate_network = "always" (scripts/live_run_settings.sh).
#
# seeded plants one thing (scripts/live_run_seeded.py), and its job summary says so first:
# - code: one known bug in the Coder's first implementation. receive() applies a delivery
#   note line by line, so a bad line part-way through leaves the store partly restocked.
#   Everything after it is the real model: the Tester, the gates, the Reviewer, the Coder's
#   own fixes or disputes, the Arbiter. It takes a restock task and no crash.
# - finding: one blocking finding as the Reviewer's first review, written without reading
#   the code: that receive() is not all or nothing. The Tester's tests catch planted bugs
#   before review (live-7, live-8), so this is what starts negotiation with the real model:
#   the real Coder answers it, the real Reviewer replies, and a dispute goes to the real
#   Tester's repro test and the real Arbiter. It takes restock-atomic, which states the rule,
#   and no crash.
# - dispute: the Reviewer's whole side, which never yields. Its first review raises the same
#   correctness blocker and a design claim the task contradicts (receive belongs on Store,
#   not in the module the task names), and every reply maintains both. So the ladder must
#   decide: the real Tester's repro test settles the correctness claim, and the real Arbiter
#   rules on the design one (the run escalates to the Arbiter, not a person). In live-9 the
#   real Reviewer withdrew in round one, so neither rung had run live. restock-atomic only.
#
# Unless crash_after_seq is 0, the run is SIGKILLed partway through, its whole process tree
# at once (scripts/live_run_crash.py), and `msa resume` continues it from the journal. The
# summary then checks that no effect the journal had answered was invoked again.
#
# The run job stops at HUMAN_APPROVAL. Nothing is published there, and the job fails if the
# run never reached that gate (failed, cancelled, blocked), so a red run is a real finding.
#
# The release job is the human gate. It runs in the `live-release` environment, which must
# have a required reviewer (Settings, Environments): GitHub then holds the job until that
# person approves it. The job reads who approved from GitHub's record of this run, runs
# `msa approve --by github:<login>`, and the run publishes to a branch of the fixture
# repository and completes. If nobody approved (an environment GitHub created on first use
# has no reviewer, and runs the job at once), it approves nothing and fails. It never
# receives the model key: approving and publishing make no model call.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Which task (.github/live-run/<task>.md)
        required: true
        type: choice
        options: [restock, restock-atomic, restock-scale, round-trip, thread-safe]
        default: restock
      budget_usd:
        description: Hard cap on model spend for the run, in US dollars (at most 20)
        required: true
        default: "5"
      crash_after_seq:
        description: >-
          SIGKILL the run once its journal holds this many events, then resume it (0: no
          crash). At 6 one of the implementation and the acceptance tests is journaled and
          the other is mid-call.
        required: true
        default: "6"
      seeded:
        description: >-
          Plant one thing; every other model call is real. code: a bug in the Coder's first
          implementation (a restock task). finding: a blocking finding as the Reviewer's
          first review (restock-atomic). dispute: the Reviewer's whole side, never yielding,
          so the repro test and the Arbiter decide (restock-atomic). All take crash_after_seq 0.
        required: true
        type: choice
        options: [none, code, finding, dispute]
        default: none

permissions:
  contents: read

env:
  RUN_ID: live-${{ github.run_number }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One spending run at a time. Only this job: a release waiting days for its reviewer
    # must not hold up the next run (live-5 waited behind live-4's release).
    concurrency:
      group: live-run-spend  # not "live-run": runs from before this held that name whole
      cancel-in-progress: false
    outputs:
      phase: ${{ steps.summary.outputs.phase }}
    env:
      TASK: ${{ inputs.task }}
      BUDGET_USD: ${{ inputs.budget_usd }}
      CRASH_AFTER_SEQ: ${{ inputs.crash_after_seq }}
      SEEDED: ${{ inputs.seeded }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: ripgrep (the search tool runs it)
        run: command -v rg || { sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; }

      - name: Check the inputs
        run: |
          python3 -c "import os, sys; b = float(os.environ['BUDGET_USD']); \
            sys.exit(0 if 0 < b <= 20 else f'budget_usd must be above 0 and at most 20, not {b}')"
          python3 -c "import os, sys; c = os.environ['CRASH_AFTER_SEQ']; \
            sys.exit(0 if c.isdigit() else f'crash_after_seq must be a whole number, not {c!r}')"
          test -f ".github/live-run/$TASK.md"
          case "$SEEDED" in
            none) ;;
            code)
              if [ "${TASK#restock}" = "$TASK" ] || [ "$CRASH_AFTER_SEQ" != 0 ]; then
                echo "::error::seeded runs take a restock task and crash_after_seq 0" && exit 1
              fi ;;
            finding|dispute)
              if [ "$TASK" != restock-atomic ] || [ "$CRASH_AFTER_SEQ" != 0 ]; then
                echo "::error::a seeded $SEEDED takes restock-atomic and crash_after_seq 0"
                exit 1
              fi ;;
            *) echo "::error::seeded must be none, code, finding or dispute, not $SEEDED" && exit 1 ;;
          esac
          echo "DB=$RUNNER_TEMP/aegis/runs.db" >> "$GITHUB_ENV"
          echo "CRASH=$RUNNER_TEMP/aegis/crash.json" >> "$GITHUB_ENV"

      - name: Network namespaces (agent commands and integration suites get no network)
        run: scripts/allow_network_namespaces.sh

      - name: The repository to change (the inventory fixture, committed)
        run: |
          cp -r tests/fixtures/repos/inventory "$RUNNER_TEMP/inventory"
          cd "$RUNNER_TEMP/inventory"
          git init -q -b main
          git add .
          git -c user.name=fixture -c user.email=fixture@localhost commit -qm base

      - name: Settings for this run
        run: |
          scripts/live_run_settings.sh "$RUNNER_TEMP/msa.toml"
          # A planted Reviewer never yields: the Arbiter, not a person, rules on what is left.
          if [ "$SEEDED" = dispute ]; then
            sed -i 's|^escalation = .*|escalation = "arbiter"|' "$RUNNER_TEMP/msa.toml"
            test "$(grep -c '^escalation = "arbiter"$' "$RUNNER_TEMP/msa.toml")" -eq 1
            uv run msa --config "$RUNNER_TEMP/msa.toml" config check
          fi

      - name: The run (real model, every stage), crashed and resumed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # The venv's msa directly, not `uv run`: the crash must reach msa's own process tree.
        run: |
          msa=("$GITHUB_WORKSPACE/.venv/bin/msa" --config "$RUNNER_TEMP/msa.toml")
          args=(run --repo "$RUNNER_TEMP/inventory" \
            --task-file ".github/live-run/$TASK.md" --run-id "$RUN_ID" \
            --budget-usd "$BUDGET_USD" --db "$DB")
          run=("${msa[@]}" "${args[@]}")
          if [ "$SEEDED" != none ]; then
            "$GITHUB_WORKSPACE/.venv/bin/python" scripts/live_run_seeded.py --plant "$SEEDED" -- \
              --config "$RUNNER_TEMP/msa.toml" "${args[@]}"
            exit
          fi
          if [ "$CRASH_AFTER_SEQ" -eq 0 ]; then
            "${run[@]}"
            exit
          fi
          uv run python scripts/live_run_crash.py --db "$DB" --run "$RUN_ID" \
            --after-seq "$CRASH_AFTER_SEQ" --evidence "$CRASH" -- "${run[@]}"
          "${msa[@]}" resume "$RUN_ID" --db "$DB"

      - name: Outcome, spend, the crash and the PR description
        id: summary
        if: always()
        run: |
          if [ "$SEEDED" = dispute ]; then
            {
              echo "## Seeded run: the Reviewer's side was planted"
              echo
              echo "It was scripted, not the model's (scripts/live_run_seeded.py): the first review"
              echo "(two blocking findings, written without reading the code) and a maintain on"
              echo "every reply. Every other model call was real: the Planner, the Coder, the"
              echo "Tester and its repro test, and the Arbiter, which this run escalates to."
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$SEEDED" = finding ]; then
            {
              echo "## Seeded run: the Reviewer's first review was planted"
              echo
              echo "It was scripted, not the model's (scripts/live_run_seeded.py): one blocking"
              echo "finding, written without reading the code, that receive() is not all or"
              echo "nothing. Every other model call was real, the Coder's implementation and its"
              echo "answer to the finding included, and so was every later review."
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$SEEDED" = code ]; then
            {
              echo "## Seeded run: the Coder's first implementation was planted"
              echo
              echo "It was scripted, not the model's (scripts/live_run_seeded.py), with one known"
              if [ "$TASK" = restock-scale ]; then
                echo "bug: receive() looks each SKU up through items(), which sorts the whole"
                echo "store, once per line, against the task's rule. Every other model call was real."
              else
                echo "bug: receive() applies a delivery note line by line, so a bad line part-way"
                echo "through leaves the store partly restocked. Every other model call was real."
              fi
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          crash=()
          if [ -f "$CRASH" ]; then crash=(--crash "$CRASH"); fi
          uv run python scripts/live_run_summary.py --db "$DB" --run "$RUN_ID" \
            --summary "$GITHUB_STEP_SUMMARY" --output "$GITHUB_OUTPUT" "${crash[@]}"

      - name: The run's state, for its release
        # Everything the release job resumes from, at the same paths: the journal, the run's
        # files and worktrees, and the repository with its history.
        if: steps.summary.outputs.phase == 'human_approval'
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/live-state.tgz" aegis inventory msa.toml

      - uses: actions/upload-artifact@v4
        if: steps.summary.outputs.phase == 'human_approval'
        with:
          name: live-state
          path: ${{ runner.temp }}/live-state.tgz
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-run
          path: |
            ${{ runner.temp }}/aegis/runs.db
            ${{ runner.temp }}/aegis/crash.json
            ${{ runner.temp }}/aegis/runs/
          if-no-files-found: warn

  release:
    # A person approves this job in GitHub, as the live-release environment's reviewer.
    needs: run
    if: needs.run.outputs.phase == 'human_approval'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live-release
    permissions:
      contents: read
      actions: read  # GitHub's record of who approved this run
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Who approved (fails unless a person did)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > approvals.json
          if ! approver=$(uv run python scripts/live_run_approver.py live-release < approvals.json)
          then
            echo "::error::no person approved this release; nothing was approved" && exit 1
          fi
          echo "approved by $approver"
          echo "APPROVER=github:$approver" >> "$GITHUB_ENV"
          echo "DB=$RUNNER_TEMP/aegis/runs.db" >> "$GITHUB_ENV"

      - name: Network namespaces (the settings require them)
        run: scripts/allow_network_namespaces.sh

      - uses: actions/download-artifact@v4
        with:
          name: live-state
          path: ${{ runner.temp }}

      - name: The run's state, where it ran
        id: restore
        run: |
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/live-state.tgz"
          uv run python -c "import json, sqlite3, sys, os; \
            row = sqlite3.connect(sys.argv[1]).execute('SELECT environment FROM runs WHERE run_id = ?', (sys.argv[2],)).fetchone(); \
            repo = json.loads(row[0])['repo']; \
            sys.exit(0 if os.path.isdir(os.path.join(repo, '.git')) else f'the run expects its repository at {repo}')" \
            "$DB" "$RUN_ID"

      - name: Approve and publish
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/msa" --config "$RUNNER_TEMP/msa.toml" \
            approve "$RUN_ID" --by "$APPROVER" --db "$DB"

      - name: The completed run and its published branch
        if: always() && steps.restore.outcome == 'success'
        run: |
          uv run python scripts/live_run_summary.py --db "$DB" --run "$RUN_ID" \
            --summary "$GITHUB_STEP_SUMMARY"
          {
            echo "## The published branch"
            echo
            echo '```'
            git -C "$RUNNER_TEMP/inventory" log -1 --format='%H%n%n%B' "aegis/$RUN_ID"
            git -C "$RUNNER_TEMP/inventory" diff --stat main "aegis/$RUN_ID"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.restore.outcome == 'success'
        with:
          name: live-release
          path: |
            ${{ runner.temp }}/aegis/runs.db
            ${{ runner.temp }}/aegis/runs/
          if-no-files-found: warn
