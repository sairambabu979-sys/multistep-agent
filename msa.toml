#:schema ./schemas/msa.schema.json
#
# The one place for model ids, beta flags, prices, and limits (PLAN §12).
# When the API changes, edit this file and nothing else. Validate with: uv run msa config check

[models]
default = "claude-opus-5-5"

# One model for every role; only effort varies (ADR-005). Opus 5.5 defaults to "medium",
# so effort is always set explicitly. These are starting points; the M9 eval tunes them.
[models.roles]
planner = { effort = "high" }
coder = { effort = "xhigh" }
tester = { effort = "high" }
reviewer = { effort = "high" }
# The Arbiter only rules on escalation: rarely, and a wrong ruling is costly.
arbiter = { effort = "max" }

[api]
base_url = "https://api.anthropic.com"  # explicit, so ANTHROPIC_BASE_URL is never picked up
max_tokens = 64000      # streamed, so large outputs do not hit HTTP timeouts
min_output_tokens = 1024
max_retries = 2         # SDK retries before a response starts; gateway retries mid-stream
retry_backoff_seconds = 2.0  # the gateway's wait before a mid-stream retry, doubling
timeout_seconds = 600
fallbacks = "default"   # on a refusal, the server re-runs on a model chosen by category

[api.betas]
server_side_fallback = "server-side-fallback-2026-07-01"
task_budgets = "task-budgets-2026-03-13"
thinking_binding = "thinking-binding-controls-2026-08-01"

# US dollars per million tokens. A served model missing here is priced at the highest rate
# of each component (over-states spend, never under-states it).
[pricing.claude-opus-5-5]
input = 4.00
output = 20.00
cache_read = 0.20
cache_write_5m = 5.00
cache_write_1h = 8.00

# Server-side refusal fallback targets. Input/output as published; the cache rates assume
# the standard 0.1x read and 1.25x / 2x write multipliers: verify on the pricing page.
[pricing.claude-opus-5]
input = 5.00
output = 25.00
cache_read = 0.50
cache_write_5m = 6.25
cache_write_1h = 10.00

[pricing.claude-opus-4-8]
input = 5.00
output = 25.00
cache_read = 0.50
cache_write_5m = 6.25
cache_write_1h = 10.00

[limits]
budget_usd = 5.0
wall_clock_minutes = 45
max_replans = 2
max_revisions = 4
max_negotiation_rounds = 3
plan_gate = "auto"
escalation = "human"

[journal]
path = ".msa/runs.db"  # SQLite; its directory holds run artifacts, tokens and the audit log
# url = "postgresql://msa@db.internal:5432/msa"  # keep the journal in PostgreSQL instead.
#   No password here: libpq reads PGPASSWORD or ~/.pgpass. --db on the command line
#   still picks a SQLite file.
# schema_name = "msa"  # the PostgreSQL schema the journal's tables live in
snapshot_every = 50

# Who may write what (ADR-006). Paths are globs relative to the worktree: `**` spans
# directories, `*` and `?` stay within one. The tool layer checks the resolved path before
# every write; no prompt can change this.
[capabilities]
# No role may write these. `**/.git` matters in a linked worktree (and a submodule),
# where .git is a file naming the git directory: rewriting it would redirect git.
protected = ["**/.git", "**/.git/**", ".msa", ".msa/**"]

[capabilities.roles]
planner = { write = [] }
coder = { write = ["**"], deny = ["tests/acceptance/**", "tests/repro/**"] }
tester = { write = ["tests/acceptance/**", "tests/repro/**"] }
reviewer = { write = [] }
arbiter = { write = [] }

# Commands in the local worktree sandbox (ADR-009). It confines paths and scrubs the
# environment, and on Linux takes the network away from agent commands. It is not a
# syscall boundary: untrusted repos need a container.
[sandbox]
launcher = ["uv", "run", "--frozen", "python", "-m"]  # `<launcher> pytest ...`
timeout_seconds = 600
output_limit_bytes = 65536
read_limit_bytes = 2097152
view_limit_chars = 100000
search_limit_matches = 200
cpu_seconds = 1800
max_file_bytes = 1073741824
env_passthrough = ["PATH", "HOME", "LANG", "LC_ALL", "TMPDIR", "TERM"]
isolate_network = "auto"  # agent commands get no network at all (unshare -rn) where possible

# STATIC_ANALYSIS: deterministic checks on the head tree, in order, over the whole worktree
# except the Tester's directories, which UNIT_TESTING checks. The preference checks always
# run too. No tests here: UNIT_TESTING and INTEGRATION_TESTING run them.
[verify]
commands = ["ruff_check", "ruff_format_check", "mypy"]

# Bounds on one agent invocation, on top of its effect's budget reservation.
[agents]
planner_max_turns = 30
coder_max_turns = 60
tester_max_turns = 60
triage_max_turns = 20
reviewer_max_turns = 40
author_max_turns = 20
repro_max_turns = 30
arbiter_max_turns = 4
repo_map_max_paths = 400

# UNIT_TESTING: each failing test is rerun alone this many times; mixed results mean flaky.
# A flaky test is reported and sent back to the Tester, never skipped.
[testing]
flake_reruns = 3
repro_directory = "tests/repro"  # repro tests that settle disputes (ADR-004)

# REVIEWING and NEGOTIATING (ADR-014). enabled = false replaces the Reviewer with a
# pass-through stand-in, named in the report: arm B of the ablation (PLAN §11).
[review]
enabled = true

# CREATED: what a run may ask for before any work starts (ADR-015).
[admission]
max_budget_usd = 50.0
max_wall_clock_minutes = 240
max_live_runs = 4  # per repository, parked runs included

# INTEGRATION_TESTING: the repository's integration suite, which UNIT_TESTING leaves out.
# isolate_network: run it in a network namespace of its own (unshare -rn) where possible.
[integration]
paths = ["tests/integration"]
isolate_network = "auto"

# SECURITY_REVIEW: secrets and insecure code in what the change adds; dependency changes.
[security]
forbid_new_dependencies = false
audit_command = []  # e.g. ["pip-audit", "--strict"], run when a dependency manifest changes

# Publishing, after a person approves: a local branch, never a push.
[release]
branch_prefix = "aegis/"

# msa serve: the HTTP API, behind bearer tokens (msa tokens add) and roles.
[service]
host = "127.0.0.1"
port = 8765
cors_origins = ["http://localhost:3000"]  # the workbench's dev server

# Traces: one span per effect, agent invocation and tool call. "console" prints them.
[observability]
traces = "none"

# Temporal (ADR-017): leave address unset to drive runs in-process. With it set, `msa worker`
# drives runs, `msa run --temporal` and `msa simulate --temporal` start them there, and every
# answer reaches the run's workflow as a signal. Needs multistep-agent[temporal].
[temporal]
# address = "localhost:7233"
namespace = "default"
task_queue = "aegis"
